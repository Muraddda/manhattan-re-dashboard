name = "rental-poc-preview"
workers_dev = true
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Preview deploy (rental-poc-preview). Deploy only with: npx wrangler deploy -c wrangler.toml
[assets]
directory = "../dashboard/dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "rental-poc-preview-db"
database_id = "b067e99c-0183-43c4-aa7a-c2bfdd795c4e"
migrations_dir = "migrations"

[vars]
VERSION = "v1-demo"
BROKERAGE_ID = "brk_demo"
# "true" = verify Turnstile tokens against Cloudflare; anything else = stub (any non-empty token accepted).
TURNSTILE_ENABLED = "false"
# TURNSTILE_SECRET goes in .dev.vars (gitignored), never in this file.
